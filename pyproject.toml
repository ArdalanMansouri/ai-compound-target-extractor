[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compound-target-extractor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "perplexityai>=0.1.0",
    "plotly>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["target_extractor*"]